
name: Terraform Destroy Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Are you sure you want to destroy infrastructure?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  destroy:
    runs-on: [self-hosted, linux, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform Destroy
        if: ${{ inputs.confirm_destroy == 'yes' }}
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Destroy Skipped
        if: ${{ inputs.confirm_destroy == 'no' }}
        run: echo "Destroy cancelled by user."
